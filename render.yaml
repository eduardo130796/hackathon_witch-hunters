# Blueprint do Render: cria o banco PostgreSQL e o serviço web a partir do Dockerfile.
# No painel do Render: New > Blueprint > escolher este repositório.
databases:
  - name: jogo-halloween-db
    plan: free
    databaseName: halloween
    user: jogo

services:
  - type: web
    name: jogo-halloween
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jogo-halloween-db
          property: connectionString
